<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Zaaa! 🎂🧸🤍</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Sacramento&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle, #ffe5ec 0%, #ffc2d1 60%, #e8aeef 100%);
      overflow-x: hidden;
    }
    .font-cute { font-family: 'Fredoka', cursive; }
    .font-romantic { font-family: 'Sacramento', cursive; }
    
    .floating-emoji {
      position: absolute;
      user-select: none;
      pointer-events: none;
      animation: floatUp 6s ease-in-out infinite;
    }
    
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.6) rotate(0deg); opacity: 0.9; }
      50% { transform: translateY(50vh) scale(1.2) rotate(15deg); }
      100% { transform: translateY(-10vh) scale(0.8) rotate(-15deg); opacity: 0; }
    }

    .wiggle-hover:hover {
      animation: wiggle 0.4s ease-in-out infinite alternate;
    }
    @keyframes wiggle {
      0% { transform: rotate(-4deg) scale(1.03); }
      100% { transform: rotate(4deg) scale(1.03); }
    }

    .polaroid {
      background: white;
      padding: 14px 14px 28px 14px;
      box-shadow: 0 12px 30px rgba(255, 105, 180, 0.35);
      transform: rotate(-2deg);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 16px;
    }
    .polaroid:hover {
      transform: rotate(0deg) scale(1.04);
      box-shadow: 0 18px 35px rgba(255, 105, 180, 0.5);
    }

    .bounce-btn {
      animation: bounceGemes 1.5s infinite;
    }
    @keyframes bounceGemes {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.04); }
    }

    .scroll-arrow {
      animation: arrowBounce 1.2s infinite;
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #ffe5ec;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #ff85a1;
      border-radius: 10px;
    }

    .click-sparkle {
      position: absolute;
      pointer-events: none;
      animation: sparkleFade 0.8s ease-out forwards;
      font-size: 24px;
    }
    @keyframes sparkleFade {
      0% { transform: scale(0.5) translateY(0); opacity: 1; }
      100% { transform: scale(1.6) translateY(-25px); opacity: 0; }
    }
  </style>
</head>
<body onclick="spawnSparkle(event)" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

  <!-- Background Beruang & Love Terbang -->
  <div id="emoji-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- KOTAK UTAMA -->
  <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border-4 border-pink-200 relative z-10 my-4 transform transition-all duration-300 hover:shadow-pink-300/50">

    <!-- HALAMAN 1: PENYAMBUTAN -->
    <div id="page-1" class="text-center py-6">
      <div class="inline-block relative mb-3 cursor-pointer wiggle-hover" onclick="popHeart(this)">
        <span class="text-6xl block animate-bounce">🧸</span>
        <span class="absolute -top-3 -right-3 text-3xl">💖</span>
        <span class="absolute -bottom-1 -left-3 text-2xl">🤍</span>
      </div>
      <h1 class="font-romantic text-5xl text-pink-500 font-bold mb-1">Happy Birthday!</h1>
      <p class="font-cute text-pink-400 text-base mb-2">🧸 ⊂(·o·)⊃ 💕</p>
      <p class="font-cute text-pink-400 text-lg mb-8">Ada kejutan manis spesial buat kamu... 🧸🤍✨</p>
      
      <button onclick="nextPage(2)" class="bounce-btn bg-gradient-to-r from-pink-400 via-rose-400 to-pink-500 text-white font-cute text-xl px-8 py-4 rounded-full shadow-lg hover:brightness-110 active:scale-95 transition-all">
        Pencet Aku! 🧸🩷
      </button>
    </div>

    <!-- HALAMAN 2: FOTO & KALENDER -->
    <div id="page-2" class="hidden text-center py-2">
      <h2 class="font-romantic text-4xl text-pink-600 font-bold mb-1">Dari Nanadd buat Zaaa 🤍</h2>
      <p class="font-cute text-xs text-pink-400 mb-3">ʕ•ᴥ•ʔ⊃❤️ Hugs & Love for You! 🧸</p>
      
      <!-- Frame Foto Polaroid -->
      <div class="polaroid mx-auto w-64 rounded-xl mb-4 relative group cursor-pointer">
        <span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-pink-200/90 px-3 py-0.5 rounded-full text-xs font-cute text-pink-600 shadow-sm z-10 flex items-center gap-1">
          🧸 Photo Memories 🎀
        </span>
        <img src="foto-zaaa.png" alt="Foto nanaddd" class="w-full h-auto rounded-lg object-cover">
      </div>
    </div>

  </div>

</body>
</html>
